<body style="margin:0;background:#FFF3DC"><svg id="s" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
<script src="../js/text.js"></script><script src="../js/art.js"></script>
<script>
const A=FE.Art;const s=document.getElementById('s');
const cast=[['maya',230,'wave','smile'],['theo',640,'think','curious'],['theo',1050,'open','grin'],['maya',1460,'point','laugh']];

</script>
