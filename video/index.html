<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluent English — Pide tu café en inglés (preview)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <div id="stage">
    <canvas id="cv" width="1080" height="1920" aria-label="Fluent English animation preview"></canvas>
    <div id="overlay">
      <div class="card">
        <h1>Pide tu café en inglés</h1>
        <p class="badge">BROWSER PREVIEW — not an exported video</p>
        <p class="small">Audio (voices, music, effects) starts after you press Start. Voices come from your own device’s speech synthesis.</p>
        <button id="startBtn" class="primary">▶ Start</button>
        <p id="voiceStatus" class="small"></p>
      </div>
    </div>
  </div>
  <aside id="controls" class="prod">
    <div class="row">
      <button id="playBtn" title="Play / pause (space)">⏸ Pause</button>
      <button id="replayBtn" title="Replay from the start">↺ Replay</button>
      <button id="ccBtn" title="Captions / IPA mode">CC: Captions + IPA</button>
      <span id="clock">0.0 / 30.0 s</span>
    </div>
    <details id="mixer">
      <summary>Mixer &amp; voices</summary>
      <label>Voice <input type="range" id="lv-voice" min="0" max="1" step="0.01" value="1"></label>
      <label>Music <input type="range" id="lv-music" min="0" max="1" step="0.01" value="0.55"></label>
      <label>Ambience <input type="range" id="lv-amb" min="0" max="1" step="0.01" value="0.7"></label>
      <label>Effects <input type="range" id="lv-sfx" min="0" max="1" step="0.01" value="0.8"></label>
      <label>Spanish voice <select id="vo-es"></select></label>
      <label>English voice <select id="vo-en"></select></label>
      <label>Voice speed <input type="range" id="rate" min="0.7" max="1.15" step="0.01" value="0.92"></label>
      <p class="small" id="voiceNote"></p>
    </details>
  </aside>
</main>
<script src="src/config.js"></script>
<script src="src/util.js"></script>
<script src="src/voices-data.js"></script>
<script src="src/art-person.js"></script>
<script src="src/art-scene.js"></script>
<script src="src/timeline.js"></script>
<script src="src/audio.js"></script>
<script src="src/player.js"></script>
</body>
</html>
