<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluent English — ¿No entendiste? (vista previa)</title>
<style>
  html,body{margin:0;background:#0A1F3C;color:#FBF5E6;font:600 15px/1.3 system-ui,sans-serif}
  body:not(.ui) #panel{display:none}
  #wrap{display:flex;gap:20px;align-items:flex-start;justify-content:center;padding:14px;min-height:100vh;box-sizing:border-box}
  body:not(.ui) #wrap{padding:0;display:block}
  canvas{display:block;width:min(56.25vh,calc(100vw - 340px),540px);height:auto;background:#000;border-radius:14px;box-shadow:0 10px 40px #0008}
  body:not(.ui) canvas{width:1080px;height:1920px;border-radius:0;box-shadow:none}
  #panel{width:280px;display:flex;flex-direction:column;gap:10px}
  button,select{font:700 15px system-ui;padding:11px 14px;border-radius:12px;border:0;background:#1FA3A0;color:#06222a;cursor:pointer}
  button#cc{background:#F2B84B}button#restart{background:#F26B5B;color:#2a0c08}
  label{display:flex;flex-direction:column;gap:3px;font-size:13px;opacity:.95}
  input[type=range]{width:100%;accent-color:#F2B84B}
  small{opacity:.75;font-weight:500}
</style></head>
<body><div id="wrap">
<canvas id="stage" width="1080" height="1920"></canvas>
<div id="panel">
  <b style="font-size:18px">Fluent English · vista previa</b>
  <div style="display:flex;gap:8px"><button id="play" style="flex:1">▶ Reproducir</button><button id="restart" title="Reiniciar">⟲</button></div>
  <span id="clock" style="font-variant-numeric:tabular-nums">0.0 / 30 s</span>
  <button id="cc">CC: Captions + IPA</button>
  <label>Voz <input id="vVoice" type="range" min="0" max="1.5" step="0.05" value="1"></label>
  <label>Música <input id="vMusic" type="range" min="0" max="1.5" step="0.05" value="1"></label>
  <label>Efectos <input id="vFx" type="range" min="0" max="1.5" step="0.05" value="1"></label>
  <label>Fuente de voz <select id="vsrc"><option value="rendered">Grabada (Kokoro, la del MP4)</option><option value="browser">Voces del navegador (es-MX / en-US)</option></select></label>
  <small id="vinfo"></small>
  <small>Atajos: espacio = pausa, C = cambiar CC. Los controles se ocultan en el render (<code>?render=1&amp;cc=2</code>).</small>
</div></div>
<script type="module" src="js/main.js"></script></body></html>
