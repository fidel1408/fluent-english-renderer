:root{color-scheme:dark;--bg:#0c1525;--panel:#15233b;--panel2:#1c2e4d;--ink:#eaf0fb;--mute:#9fb2cf;--accent:#ffd166;--ok:#2fbf7a;--focus:#7fc6ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;position:relative}
#mini{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;z-index:5;opacity:.35;transition:opacity .2s}#mini:hover,#mini:focus-within{opacity:1}#mini button{background:rgba(12,21,37,.88);font-size:14px}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 10px 4px}
#stage{position:relative;aspect-ratio:16/9;width:min(100%,calc((100vh - var(--ctl-h,190px)) * 16 / 9));max-width:100%;max-height:100%;margin:auto}
#cv{width:100%;height:100%;display:block;border-radius:10px;background:#f4eedf;box-shadow:0 6px 30px rgba(0,0,0,.45)}
#loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1525;border-radius:10px;color:var(--mute);font-size:18px}
#loader[hidden],#toast[hidden],#mini[hidden]{display:none}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(10,20,40,.94);color:#fff;border:2px solid var(--accent);padding:10px 18px;border-radius:999px;font-size:17px;max-width:90%;text-align:center}
#controls{background:var(--panel);border-top:1px solid #243a5e;padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid #33507f;border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover,select:hover{background:#25406a}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.round{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);border-color:var(--accent);color:#102040}
.round:hover{background:#ffe08f}
.round svg{width:22px;height:22px;fill:currentColor}
#btnPlay[data-state=playing] .i-play{display:none} #btnPlay:not([data-state=playing]) .i-pause{display:none}
.time{font-variant-numeric:tabular-nums;color:var(--mute);min-width:44px;text-align:center}
#scrubWrap{position:relative;flex:1;min-width:220px;height:36px;display:flex;align-items:center}
#scrub{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent) var(--p,0%),#31496f var(--p,0%));margin:0;cursor:pointer}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
#scrub::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
#marks{position:absolute;left:11px;right:11px;top:0;bottom:0;pointer-events:none}
#marks .tick{position:absolute;top:5px;width:2px;height:26px;background:rgba(255,255,255,.45);transform:translateX(-1px)}
#marks .star{position:absolute;top:-4px;transform:translateX(-50%);color:var(--ok);font-size:15px;font-style:normal}
#chapters{display:flex;gap:6px;flex-wrap:wrap}
.chap{padding:4px 10px;font-size:13px;border-radius:999px}.chap small{opacity:.7;font-size:11px;margin-left:3px}
.chap[aria-current=true]{background:var(--accent);color:#102040;border-color:var(--accent);font-weight:700}
label.ctl{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:14px}
input[type=range].mini{width:96px;accent-color:var(--accent)}
button[aria-pressed=true]{background:#2c5a98;border-color:#6aa8ff}
#transcript{margin:0 14px 8px;color:var(--mute);font-size:14px}
#transcript summary{cursor:pointer;padding:4px 0}
#transcriptBody{max-height:140px;overflow:auto;background:var(--panel);border-radius:8px;padding:6px 12px}
#transcriptBody p{margin:4px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hint{color:var(--mute);font-size:13px}
@media (max-width:760px){.round{width:40px;height:40px}.chap{font-size:13px}}
</style>
</head>

<div id="app">

      <button id="prevAct" type="button" aria-label="Previous activity">&laquo; Activity</button><button id="nextAct" type="button" aria-label="Next activity">Activity &raquo;</button>
      <label class="ctl">Speed <select id="speed" aria-label="Playback speed"><option value="0.8">0.8&times;</option><option value="1" selected>1&times;</option><option value="1.2">1.2&times;</option></select></label>
      <label class="ctl">Frame rate <select id="fps" aria-label="Frame rate"><option value="30" selected>30 (light)</option><option value="60">60</option></select></label>
      <button id="full" type="button">Full screen</button>
      <button id="hideBar" type="button" aria-label="Hide the menu bar (H)">Hide menu</button>
      <span class="hint">Space play/pause &middot; &larr;&rarr; 5 s &middot; [ ] chapter &middot; N P activity &middot; 1&ndash;3 answer &middot; C captions &middot; H hide menu &middot; R replay</span>
    </div>
  </div>
  <details id="transcript"><summary>Transcript</summary><div id="transcriptBody"></div></details>
  </div>
  <div id="mini" hidden><button id="miniPlay" type="button" aria-label="Play or pause">&#9654;&#10074;&#10074;</button><button id="showBar" type="button" aria-label="Show the menu bar">Show menu</button></div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>

<script>/* ===== util.js ===== */
/* util.js — math, easing, color and path helpers shared by every module */
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const E = {
  lin: t => t,
  in: t => t * t * t,
  out: t => 1 - Math.pow(1 - t, 3),
  io: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  soft: t => t * t * (3 - 2 * t),
  back: t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  anticip: t => { const c = 1.2; return t * t * ((c + 1) * t - c); },       // small pull-back before moving
  spring: t => 1 - Math.exp(-6.5 * t) * Math.cos(t * 9.5),                  // settle with follow-through
};

/* deterministic random: mulberry32 */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---- color ---- */
const _cc = new Map();
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(h, amt) { // amt -1..1 : darken/lighten, with slight warm shift in shadows
  const k = h + '|' + amt; if (_cc.has(k)) return _cc.get(k);
  let [r, g, b] = hex2rgb(h), o;
  if (amt >= 0) o = rgbHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  else { const a = -amt; o = rgbHex(r * (1 - a) + 20 * a * 0.4, g * (1 - a * 1.04), b * (1 - a * 0.92) + 28 * a * 0.35); }
  _cc.set(k, o); return o;
}
function rgba(h, a) { const k = h + '@' + a; if (_cc.has(k)) return _cc.get(k); const [r, g, b] = hex2rgb(h); const o = `rgba(${r},${g},${b},${a})`; _cc.set(k, o); return o; }
function mix(h1, h2, t) { const a = hex2rgb(h1), b = hex2rgb(h2); return rgbHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)); }

/* ---- gradients & shapes ---- */
function lg(ctx, x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function rg(ctx, x, y, r0, r1, stops, x1 = x, y1 = y) { const g = ctx.createRadialGradient(x, y, r0, x1, y1, r1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
/* tapered limb segment with round ends, as a closed path */
function limb(ctx, x0, y0, x1, y1, w0, w1) {
  const a = Math.atan2(y1 - y0, x1 - x0), nx = -Math.sin(a), ny = Math.cos(a);
  ctx.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2);
  ctx.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
  ctx.arc(x1, y1, w1 / 2, a + Math.PI / 2, a - Math.PI / 2, true);
  ctx.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2);
  ctx.arc(x0, y0, w0 / 2, a - Math.PI / 2, a + Math.PI / 2, true);
  ctx.closePath();
}
/* Catmull-Rom closed spline through points -> bezier path */
function spline(ctx, pts, closed = true, tension = 0.5) {
  const n = pts.length; if (n < 3) return;
  const P = i => pts[(i + n) % n];
  ctx.moveTo(pts[0][0], pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = closed ? P(i - 1) : pts[Math.max(i - 1, 0)], p1 = P(i), p2 = closed ? P(i + 1) : pts[Math.min(i + 1, n - 1)], p3 = closed ? P(i + 2) : pts[Math.min(i + 2, n - 1)];
    const t = tension / 3 * 2;
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) * t / 2 * 1, p1[1] + (p2[1] - p0[1]) * t / 2 * 1,
      p2[0] - (p3[0] - p1[0]) * t / 2, p2[1] - (p3[1] - p1[1]) * t / 2, p2[0], p2[1]);
  }
  if (closed) ctx.closePath();
}
function star(ctx, cx, cy, r1, r2, n = 5, rot = -Math.PI / 2) {
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n; const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath();
}
/* soft drop shadow helper (cheap: one shadowBlur fill) */
function withShadow(ctx, color, blur, dx, dy, fn) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.shadowOffsetX = dx; ctx.shadowOffsetY = dy; fn(); ctx.restore(); }

/* ---- keyframe tracks: pure functions of time, so scrubbing is exact ---- */
class Track {
  constructor(init) { this.segs = []; this.init = init; }
  add(t, to, dur = 0.5, ease = E.io) { this.segs.push({ t, dur, to, ease }); return this; }
  finalize() {
    this.segs.sort((a, b) => a.t - b.t);
    let prev = this.init;
    for (const s of this.segs) { s.from = prev; prev = s.to; }

    ctx.fillStyle = rg(ctx, x - r * 0.3 + sway, y - r * 0.4, 1, r * 1.1, [[0, hi], [0.55, base], [1, shade(base, -0.4)]]);

}

function hairBack(ctx, c, P, sway) {
  const s = c.style;
  if (s === 'curls') drawCurls(ctx, c, curlSet(7).back, sway * 0.5);
  else if (s === 'short') {
    ctx.fillStyle = lg(ctx, 0, -130, 0, 10, [[0, c.hairHi], [0.4, c.hair], [1, shade(c.hair, -0.3)]]);
    ctx.beginPath(); ctx.moveTo(-82, -6); ctx.bezierCurveTo(-98, -78, -50, -128, 8, -126); ctx.bezierCurveTo(70, -124, 100, -70, 82, -4);

    ctx.beginPath(); ctx.moveTo(0, -118);

}

function hairFront(ctx, c, P, sway) {
  const s = c.style;
  if (s === 'curls') { drawCurls(ctx, c, curlSet(7).front, sway * 0.3); return; }
  if (s === 'short') {
    ctx.fillStyle = lg(ctx, -60, -120, 60, -40, [[0, c.hairHi], [0.45, c.hair], [1, shade(c.hair, -0.25)]]);

}

/* ------------------------------------------------------------- body & clothes */
function drawTorso(ctx, c, P) {
  const sw = c.sw, sh = -P.shrug * 10;
  const body = new Path2D();
  body.moveTo(-30, -8); body.bezierCurveTo(-64, 0 + sh, -sw + 34, 4 + sh, -sw + 2, 34 + sh);
  body.bezierCurveTo(-sw - 12, 80, -sw - 6, 200, -sw + 2, 330);
  body.lineTo(-sw + 4, 700); body.lineTo(sw - 4, 700); body.lineTo(sw - 2, 330);

  if (o === 'sweater') {

    ctx.fillStyle = c.collar; ctx.beginPath(); ctx.moveTo(-34, -10); ctx.lineTo(0, 62); ctx.lineTo(34, -10); ctx.lineTo(48, 4); ctx.lineTo(0, 78); ctx.lineTo(-48, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = lg(ctx, 0, -10, 0, 70, [[0, '#E9F2FB'], [1, '#B9D0E8']]);
    ctx.beginPath(); ctx.moveTo(-30, -10); ctx.lineTo(0, 56); ctx.lineTo(30, -10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = shade(c.top, -0.45); ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(-50, 4); ctx.lineTo(0, 80); ctx.lineTo(50, 4); ctx.stroke();
  } else if (o === 'blazer') {
    ctx.fillStyle = c.collar; ctx.beginPath(); ctx.moveTo(-34, -10); ctx.bezierCurveTo(-30, 40, -12, 74, 0, 82); ctx.bezierCurveTo(12, 74, 30, 40, 34, -10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgba('#000000', 0.07); ctx.beginPath(); ctx.moveTo(-34, -10); ctx.bezierCurveTo(-30, 40, -12, 74, 0, 82); ctx.lineTo(0, -10); ctx.fill();
    // lapels

    ctx.fillStyle = c.pendant; ctx.beginPath(); ctx.arc(0, 66, 7.5, 0, TAU); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-2, 64, 2.4, 0, TAU); ctx.fill();
    // buttons
    ctx.fillStyle = shade(c.top, -0.4); for (const y of [190, 270]) { ctx.beginPath(); ctx.arc(-6, y, 5, 0, TAU); ctx.fill(); }
  } else if (o === 'cardigan') {
    ctx.fillStyle = c.collar; ctx.beginPath(); ctx.moveTo(-60, -10); ctx.bezierCurveTo(-52, 60, -20, 120, 0, 150); ctx.bezierCurveTo(20, 120, 52, 60, 60, -10); ctx.closePath(); ctx.fill();

function drawNeck(ctx, c) {
  ctx.fillStyle = lg(ctx, -30, 0, 30, 0, [[0, shade(c.skin, -0.12)], [0.5, c.skin], [1, shade(c.skin, -0.28)]]);

  ctx.fillStyle = rgba(shade(c.skin, -0.6), 0.32); ctx.beginPath(); ctx.moveTo(-28, -40); ctx.quadraticCurveTo(0, -4, 28, -40); ctx.lineTo(28, -62); ctx.lineTo(-28, -62); ctx.fill();
}

/* ------------------------------------------------------------------ arms */
function ik(sx, sy, tx, ty, L1, L2, bendSign) {
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy);
  const dmax = L1 + L2 - 2, dmin = Math.abs(L1 - L2) + 6;
  const dd = clamp(d, dmin, dmax);
  const a = Math.atan2(dy, dx);
  const cosA = clamp((L1 * L1 + dd * dd - L2 * L2) / (2 * L1 * dd), -1, 1);
  const A = Math.acos(cosA) * bendSign;
  const ex = sx + Math.cos(a + A) * L1, ey = sy + Math.sin(a + A) * L1;
  const wx = sx + Math.cos(a) * dd, wy = sy + Math.sin(a) * dd;
  return { ex, ey, wx, wy };
}

function drawHand(ctx, c, type, side, shade_) {
  const skin = c.skin, sk2 = shade(skin, -0.25), ol = rgba(shade(skin, -0.6), 0.65);
  const th = side;                                            // thumb side: toward body centre
  const fing = (x0, y0, x1, y1, w) => { ctx.beginPath(); limb(ctx, x0, y0, x1, y1, w, w * 0.88); ctx.fill(); ctx.stroke(); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.8; ctx.strokeStyle = ol;
  const g = lg(ctx, -22, 0, 22, 0, [[0, shade(skin, 0.06)], [1, sk2]]);
  ctx.fillStyle = g;
  if (type === 'open') {
    // palm presented, fingers fanned
    ctx.beginPath(); ctx.ellipse(0, 24, 22, 26, 0, 0, TAU); ctx.fill(); ctx.stroke();
    const fa = [-0.46, -0.16, 0.12, 0.40], fl = [28, 36, 34, 27];
    ctx.fillStyle = g;
    for (let i = 0; i < 4; i++) { const a = Math.PI / 2 + fa[i]; fing(Math.cos(a) * 10 * 0 + (i - 1.5) * 10, 38, (i - 1.5) * 10 + Math.cos(a) * fl[i], 38 + Math.sin(a) * fl[i], 11); }
    fing(th * 18, 20, th * 44, 34, 12.5);
    ctx.fillStyle = rgba(sk2, 0.5); ctx.beginPath(); ctx.ellipse(0, 26, 11, 12, 0, 0, TAU); ctx.fill();
  } else if (type === 'point') {
    ctx.beginPath(); ctx.ellipse(0, 24, 21, 24, 0, 0, TAU); ctx.fill(); ctx.stroke();
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.ellipse(-th * (i - 2) * -1 * 0 + (i - 2.2) * 10 * -th, 44, 8.5, 9, 0, 0, TAU); ctx.fill(); ctx.stroke(); }
    fing(-th * 11, 34, -th * 11 + th * 0, 76, 11.5);
    fing(th * 16, 26, th * 28, 42, 12);
  } else if (type === 'grip') {
    ctx.beginPath(); rrect(ctx, -23, 6, 46, 44, 16); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = rgba(sk2, 0.9); ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-18, 20 + i * 9); ctx.lineTo(16, 20 + i * 9); ctx.stroke(); }
    ctx.strokeStyle = ol; ctx.lineWidth = 1.8; ctx.fillStyle = g; fing(th * 14, 10, th * 22, 34, 14);
  } else { // rest / relaxed
    ctx.beginPath(); ctx.ellipse(0, 24, 21, 25, 0, 0, TAU); ctx.fill(); ctx.stroke();
    for (let i = 0; i < 4; i++) fing((i - 1.5) * 9.5, 40, (i - 1.5) * 9.2 + th * 1.2, 60 + (i === 1 || i === 2 ? 4 : 0), 10);
    fing(th * 17, 14, th * 27, 38, 12.5);
  }
}

function drawItem(ctx, item, side) {
  ctx.save();
  if (item === 'phone') { ctx.translate(side * 4, 38); ctx.rotate(side * 0.25); ctx.fillStyle = '#1D2230'; ctx.beginPath(); rrect(ctx, -22, -4, 44, 76, 8); ctx.fill(); ctx.fillStyle = lg(ctx, 0, 0, 0, 70, [[0, '#7FC6F2'], [1, '#3A7DB8']]); ctx.beginPath(); rrect(ctx, -18, 0, 36, 66, 5); ctx.fill(); }
  else if (item === 'keys') { ctx.translate(0, 62); ctx.strokeStyle = '#B9BEC7'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 11, 0, TAU); ctx.stroke(); ctx.fillStyle = '#D9A93B'; for (const a of [0.5, 1.7, 2.6]) { ctx.save(); ctx.rotate(a); ctx.fillRect(10, -3.5, 38, 7); ctx.fillRect(40, 3, 5, 10); ctx.restore(); } }
  else if (item === 'cup') { ctx.translate(0, 52); ctx.fillStyle = '#F7F1E7'; ctx.beginPath(); ctx.moveTo(-24, -26); ctx.lineTo(24, -26); ctx.lineTo(18, 28); ctx.quadraticCurveTo(0, 34, -18, 28); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#7A4A2A'; ctx.fillRect(-23, -26, 46, 8); ctx.strokeStyle = '#F7F1E7'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(side * -30, -2, 12, -1.3, 1.3, side > 0); ctx.stroke(); }
  else if (item === 'report') { ctx.translate(side * 6, 54); ctx.rotate(side * -0.08); ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#B7C2D0'; ctx.lineWidth = 2; ctx.beginPath(); rrect(ctx, -56, -40, 112, 150, 6); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#2E7DD7'; ctx.fillRect(-42, -26, 52, 9); ctx.fillStyle = '#C7D2E0'; for (let i = 0; i < 5; i++) ctx.fillRect(-42, -6 + i * 12, 84 - (i % 2) * 18, 5); ctx.fillStyle = '#17A589'; ctx.fillRect(-42, 60, 18, 30); ctx.fillStyle = '#F28C28'; ctx.fillRect(-18, 46, 18, 44); ctx.fillStyle = '#2E7DD7'; ctx.fillRect(6, 70, 18, 20); }
  else if (item === 'planner') { ctx.translate(side * 4, 50); ctx.fillStyle = '#7A3B4F'; ctx.beginPath(); rrect(ctx, -34, -30, 68, 100, 6); ctx.fill(); ctx.fillStyle = '#F6E7C9'; ctx.fillRect(-28, -24, 56, 88); ctx.fillStyle = '#C8B58C'; for (let i = 0; i < 5; i++) ctx.fillRect(-22, -12 + i * 14, 44, 3); }
  ctx.restore();
}

function drawArm(ctx, c, P, side, arm, outfit) {
  const sx = side * (c.sw - 24), sy = 34 - P.shrug * 10;
  const L1 = 172, L2 = 160;
  const r = ik(sx, sy, arm.x, arm.y, L1, L2, (side < 0 ? 1 : -1) * (arm.y < 60 ? -1 : 1));   // raised hand: elbow drops
  const sleeve = c.top, w0 = 64, w1 = 52, w2 = 46;
  ctx.save();
  // upper arm + forearm sleeves
  const path = new Path2D();
  const add = (x0, y0, x1, y1, a, b) => { const p = new Path2D(); const t = ctx; t.beginPath(); limb(t, x0, y0, x1, y1, a, b); };
  ctx.fillStyle = lg(ctx, sx - 40, sy, sx + 40, sy + 100, [[0, shade(sleeve, 0.12)], [0.6, sleeve], [1, shade(sleeve, -0.28)]]);
  ctx.strokeStyle = rgba(shade(sleeve, -0.6), 0.65); ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  ctx.beginPath(); limb(ctx, sx, sy, r.ex, r.ey, w0, w1); ctx.fill(); ctx.stroke();
  ctx.beginPath(); limb(ctx, r.ex, r.ey, r.wx, r.wy, w1, w2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(r.ex, r.ey, w1 / 2 - 0.6, 0, TAU); ctx.fill();
  // fold highlight on forearm
  ctx.strokeStyle = rgba(shade(sleeve, 0.35), 0.35); ctx.lineWidth = 5; ctx.lineCap = 'round';
  const fa = Math.atan2(r.wy - r.ey, r.wx - r.ex), nx = -Math.sin(fa) * 9, ny = Math.cos(fa) * 9;
  ctx.beginPath(); ctx.moveTo(r.ex + nx * -1 + Math.cos(fa) * 18, r.ey + ny * -1 + Math.sin(fa) * 18); ctx.lineTo(r.wx + nx * -0.7 - Math.cos(fa) * 20, r.wy + ny * -0.7 - Math.sin(fa) * 20); ctx.stroke();
  // cuff
  const cx = r.wx - Math.cos(fa) * 12, cy = r.wy - Math.sin(fa) * 12;
  ctx.fillStyle = outfit === 'sweater' ? shade(sleeve, -0.12) : outfit === 'blazer' ? c.collar : shade(sleeve, -0.1);
  ctx.strokeStyle = rgba(shade(sleeve, -0.6), 0.6); ctx.lineWidth = 2;
  ctx.beginPath(); limb(ctx, cx, cy, r.wx + Math.cos(fa) * 3, r.wy + Math.sin(fa) * 3, w2 + 3, w2 + 1); ctx.fill(); ctx.stroke();
  // hand
  ctx.translate(r.wx, r.wy); ctx.rotate(fa - Math.PI / 2);
  if (arm.item && (arm.item === 'report' || arm.item === 'planner')) drawItem(ctx, arm.item, -side);
  ctx.scale(1.22, 1.22);
  drawHand(ctx, c, arm.hand || 'rest', -side);
  if (arm.item && arm.item !== 'report' && arm.item !== 'planner') drawItem(ctx, arm.item, -side);
  ctx.restore();
  return r;
}

/* ------------------------------------------------------------------ whole figure */
function drawHead(ctx, c, P, sway) {
  const face = getFace(c), yawShift = P.yaw * 15;
  ctx.save();
  ctx.translate(0, -30 + P.pitch * 6); ctx.rotate(P.roll); ctx.scale(HS, HS); ctx.translate(0, -118);
  if (c.style !== 'long') hairBack(ctx, c, P, sway);
  // ears
  for (const s of [-1, 1]) {
    const vis = s * P.yaw > 0.3 ? 0.4 : 1;
    ctx.fillStyle = shade(c.skin, -0.1); ctx.beginPath(); ctx.ellipse(s * 77 + yawShift * 0.3, 0, 12 * vis, 20, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = rgba(shade(c.skin, -0.5), 0.35); ctx.beginPath(); ctx.ellipse(s * 77 + yawShift * 0.3, 2, 5 * vis, 11, 0, 0, TAU); ctx.fill();
    if (c.earring && s === -1) { ctx.fillStyle = c.earring; ctx.beginPath(); ctx.arc(s * 77 + yawShift * 0.3, 24, 5.5, 0, TAU); ctx.fill(); }
    if (c.earring && s === 1) { ctx.fillStyle = c.earring; ctx.beginPath(); ctx.arc(s * 77 + yawShift * 0.3, 24, 5.5, 0, TAU); ctx.fill(); }
  }
  // face
  ctx.save(); ctx.translate(0, P.pitch * 5);
  ctx.fillStyle = rg(ctx, -22 + yawShift, -34, 8, 150, [[0, shade(c.skin, 0.14)], [0.55, c.skin], [1, shade(c.skin, -0.30)]]);
  ctx.fill(face);
  ctx.save(); ctx.clip(face);
  // cheek blush, jaw shadow, forehead hair shadow
  const bl = c.cheek; ctx.fillStyle = rgba('#E8636B', bl * (0.7 + 0.5 * clamp(P.smile, 0, 1)));
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 46 + yawShift, 30, 18, 11, 0, 0, TAU); ctx.fill(); }
  ctx.fillStyle = lg(ctx, 0, 40, 0, 100, [[0, 'rgba(60,20,10,0)'], [1, 'rgba(60,20,10,.22)']]); ctx.fillRect(-90, 40, 180, 70);
  ctx.fillStyle = lg(ctx, 0, -98, 0, -52, [[0, 'rgba(40,15,8,.30)'], [1, 'rgba(40,15,8,0)']]); ctx.fillRect(-90, -100, 180, 50);
  if (c.stubble) {
    ctx.fillStyle = lg(ctx, 0, 20, 0, 100, [[0, 'rgba(40,28,22,0)'], [0.4, 'rgba(40,28,22,.22)'], [1, 'rgba(40,28,22,.38)']]);
    ctx.beginPath(); ctx.moveTo(-82, 10); ctx.bezierCurveTo(-60, 30, -30, 38, 0, 38); ctx.bezierCurveTo(30, 38, 60, 30, 82, 10); ctx.lineTo(82, 110); ctx.lineTo(-82, 110); ctx.fill();
    const r = rng(11); ctx.fillStyle = 'rgba(30,20,16,.35)'; for (let i = 0; i < 90; i++) { const x = (r() - 0.5) * 120, y = 44 + r() * 46; if (Math.abs(x) < 22 && y < 62) continue; ctx.fillRect(x, y, 1.6, 1.6); }
  }
  ctx.restore();
  ctx.strokeStyle = rgba(shade(c.skin, -0.6), 0.5); ctx.lineWidth = 2.2; ctx.stroke(face);
  drawNose(ctx, c, yawShift);
  drawBrow(ctx, c, -1, P, yawShift); drawBrow(ctx, c, 1, P, yawShift);
  drawEye(ctx, c, -1, P, yawShift); drawEye(ctx, c, 1, P, yawShift);
  drawMouth(ctx, c, P, yawShift);
  if (c.glasses) {
    ctx.strokeStyle = '#272A35'; ctx.lineWidth = 3.4; ctx.lineJoin = 'round';
    for (const s of [-1, 1]) { ctx.fillStyle = 'rgba(160,200,235,.10)'; ctx.beginPath(); rrect(ctx, s * 34 + yawShift - 28, -25, 56, 42, 16); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(s * 34 + yawShift - 16, -17); ctx.lineTo(s * 34 + yawShift - 4, -22); ctx.stroke(); ctx.strokeStyle = '#272A35'; ctx.lineWidth = 3.4; }
    ctx.beginPath(); ctx.moveTo(-5 + yawShift, -10); ctx.quadraticCurveTo(0 + yawShift, -15, 5 + yawShift, -10); ctx.stroke();
    ctx.lineWidth = 3; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 62 + yawShift, -10); ctx.lineTo(s * 79 + yawShift * 0.3, -8); ctx.stroke(); }

}

function anchors(c, P) {
  // head centre & mouth in character-local coordinates (after lean/roll)
  const cr = Math.cos(P.roll), sr = Math.sin(P.roll);
  const loc = (x, y) => { x *= HS; y *= HS; const px = x * cr - y * sr, py = x * sr + y * cr; return [px, py - 30 + P.pitch * 6]; };
  const hc = loc(0, -118), mo = loc(P.yaw * 15 * 1.05, -118 + 55 + P.pitch * 5), eyes = [loc(-34 + P.yaw * 15, -122), loc(34 + P.yaw * 15, -122)];
  const lean = (p) => { const a = P.lean, cy = 500, dx = p[0], dy = p[1] - cy; return [dx * Math.cos(a) - dy * Math.sin(a), dx * Math.sin(a) + dy * Math.cos(a) + cy]; };
  return { head: lean(hc), mouth: lean(mo), eyeL: lean(eyes[0]), eyeR: lean(eyes[1]) };
}

/* draw the figure; (ox,oy) is the neck-base position in the current space, s = scale, flip = face left */
function drawFigure(ctx, id, P, ox, oy, s, flip, sway) {
  const c = CAST[id];
  P.armL = P.armL || REST_ARM(c, -1); P.armR = P.armR || REST_ARM(c, 1);
  ctx.save();
  ctx.translate(ox + P.bx * s, oy + P.by * s); ctx.scale(flip ? -s : s, s);
  // breathing handled by caller through by/lean; rotate upper body about the waist
  ctx.translate(0, 500); ctx.rotate(P.lean); ctx.translate(0, -500);
  hairBack_longOnly(ctx, c, P, sway);
  drawTorso(ctx, c, P);
  drawNeck(ctx, c);
  if (c.scarf) drawScarf(ctx, c);
  if (c.style === 'long') hairShoulder(ctx, c, P, sway);
  const outfit = c.outfit;
  drawArm(ctx, c, P, -1, P.armL, outfit);
  drawArm(ctx, c, P, 1, P.armR, outfit);
  drawHead(ctx, c, P, sway);
  ctx.restore();
}
function hairBack_longOnly(ctx, c, P, sway) {
  if (c.style !== 'long') return;
  ctx.save(); ctx.translate(0, -30 + P.pitch * 6); ctx.rotate(P.roll); ctx.scale(HS, HS); ctx.translate(0, -118);
  hairBack(ctx, c, P, sway); ctx.restore();
}

  ctx.fillStyle = lg(ctx, 0, -20, 0, 240, [[0, c.hairHi], [0.3, c.hair], [1, shade(c.hair, -0.3)]]);
  for (const s of [-1, 1]) {

    ctx.strokeStyle = rgba(c.hairHi, 0.6); ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 88, 10); ctx.bezierCurveTo(s * 104, 60, s * 100, 120, s * 94 + sway * 0.5, 180); ctx.stroke();
  }
}
function drawScarf(ctx, c) {
  ctx.fillStyle = lg(ctx, -60, 0, 60, 60, [[0, shade(c.scarf, 0.18)], [1, shade(c.scarf, -0.2)]]);
  ctx.beginPath(); ctx.moveTo(-52, -6); ctx.bezierCurveTo(-40, 38, 40, 38, 52, -6); ctx.bezierCurveTo(44, -18, -44, -18, -52, -6); ctx.fill();

  ctx.strokeStyle = rgba('#FFFFFF', 0.28); ctx.lineWidth = 3; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(8, 50 + i * 24); ctx.lineTo(28, 44 + i * 24); ctx.stroke(); }

/* expression presets: brow raise, inner-brow tilt, lid openness, smile, extra open mouth */

/* ===== scenes.js ===== */
/* scenes.js — layered scenery, drawn once into offscreen canvases (no per-frame path generation).
   World = 2304x1296 (1920x1080 view + 192/108 overscan so the camera can pan and push in).
   Each scene has `bg` (behind the cast) and `fg` (table/desk/props in front of the cast).
   Scenery contains no words, so nothing on screen is missing its IPA.                              */
'use strict';
const WORLD = { w: 2304, h: 1296, ox: 192, oy: 108 };

function mk() { const c = document.createElement('canvas'); c.width = WORLD.w; c.height = WORLD.h; const x = c.getContext('2d'); x.translate(WORLD.ox, WORLD.oy); return [c, x]; }

/* ---- shared props ---- */
function plant(ctx, x, y, s, seed = 1, pot = '#C9774B') {
  const r = rng(seed); ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = lg(ctx, -50, 0, 50, 0, [[0, shade(pot, 0.12)], [1, shade(pot, -0.25)]]); ctx.beginPath(); ctx.moveTo(-52, 0); ctx.lineTo(52, 0); ctx.lineTo(40, 100); ctx.quadraticCurveTo(0, 112, -40, 100); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(pot, 0.18); ctx.fillRect(-56, -6, 112, 16);
  const greens = ['#2F7D4F', '#3F9A63', '#58B47A', '#25694A'];
  for (let i = 0; i < 16; i++) {
    const a = -Math.PI / 2 + (r() - 0.5) * 2.3, L = 90 + r() * 120;
    ctx.save(); ctx.rotate(a + Math.PI / 2); ctx.fillStyle = greens[i % 4];
    ctx.beginPath(); ctx.moveTo(0, -4); ctx.bezierCurveTo(26, -L * 0.3, 22, -L * 0.8, 0, -L); ctx.bezierCurveTo(-22, -L * 0.8, -26, -L * 0.3, 0, -4); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, -L * 0.9); ctx.stroke(); ctx.restore();
  }

}
function glow(ctx, x, y, r, color, a) { ctx.fillStyle = rg(ctx, x, y, 0, r, [[0, rgba(color, a)], [1, rgba(color, 0)]]); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function vignette(ctx, a = 0.28) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rg(ctx, WORLD.w / 2, WORLD.h / 2, WORLD.h * 0.35, WORLD.w * 0.68, [[0, 'rgba(20,12,8,0)'], [1, `rgba(20,12,8,${a})`]]); ctx.fillRect(0, 0, WORLD.w, WORLD.h); ctx.restore();

  ctx.fillStyle = '#6B4428'; ctx.fillRect(x - 10, y - 10, w + 20, h + 20); ctx.fillStyle = '#FFF8EC'; ctx.fillRect(x, y, w, h);

  ctx.fillStyle = c2; ctx.fillRect(x + w * 0.1, y + h * 0.7, w * 0.8, h * 0.12); ctx.fillStyle = c3; ctx.beginPath(); ctx.arc(x + w * 0.68, y + h * 0.35, w * 0.11, 0, TAU); ctx.fill();
}
function cupProp(ctx, x, y, s = 1, tint = '#F7F1E7', coffee = '#6B3E22') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(40,20,10,.22)'; ctx.beginPath(); ctx.ellipse(8, 8, 62, 14, 0, 0, TAU); ctx.fill();

  ctx.fillStyle = lg(ctx, -38, 0, 38, 0, [[0, tint], [1, shade(tint, -0.16)]]); ctx.beginPath(); ctx.moveTo(-38, -44); ctx.lineTo(38, -44); ctx.quadraticCurveTo(34, 2, 0, 4); ctx.quadraticCurveTo(-34, 2, -38, -44); ctx.fill();

function floorBoards(ctx, y0, base, plank = 120, seed = 3) {

}

/* ===== gfx.js ===== */
/* gfx.js — teaching graphics: bubbles, ribbons, tiles, brackets, arrows, badges, icons.
   All shapes are generated once or are cheap per-frame paths (a few dozen segments).           */
'use strict';

const COL = {
  ink: '#14213D', paper: '#FFFDF7', paper2: '#F6EFE2',
  subj: '#1F6FD1', aux: '#D9660B', part: '#0E8A6E', not: '#C93545', time: '#7A47CC', wh: '#7A47CC',
  subjL: '#DCEAFB', auxL: '#FDE6D0', partL: '#D5F1E8', notL: '#FADCE0', timeL: '#E9DFF8',
  navy: '#0F2A4D', gold: '#E9B949', ok: '#1E9E5A', bad: '#C93545', grey: '#8A94A6',

/* ------------------------------------------------------------ speech bubbles */
function makeBubble(str, o = {}) {
  const size = o.size || 42;
  const tb = T(str, { size, maxW: o.maxW || 700, weight: 500 });
  const padX = o.padX || 34, padY = o.padY || 22;
  const n = 3.1, Aw = tb.w / 2 + padX, Ah = tb.h / 2 + padY;
  const r = Math.pow(Math.pow((tb.w / 2) / Aw, n) + Math.pow((tb.h / 2) / Ah, n), 1 / n);
  const k = Math.max(1, r * 1.04), a = Aw * k, b = Ah * k;
  const rn = rng(hash(str)), ph = [rn() * 6.28, rn() * 6.28, rn() * 6.28], amp = [0.016 + rn() * 0.01, 0.012, 0.008];
  const N = 120, pts = [];
  for (let i = 0; i < N; i++) {
    const th = i / N * TAU, c = Math.cos(th), s = Math.sin(th);
    const rr = Math.pow(Math.pow(Math.abs(c), n) + Math.pow(Math.abs(s), n), -1 / n);
    const wob = 1 + amp[0] * Math.sin(2 * th + ph[0]) + amp[1] * Math.sin(3 * th + ph[1]) + amp[2] * Math.sin(5 * th + ph[2]);
    pts.push([c * rr * a * wob, s * rr * b * wob]);
  }
  let per = 0; for (let i = 0; i < N; i++) { const p = pts[i], q = pts[(i + 1) % N]; per += Math.hypot(q[0] - p[0], q[1] - p[1]); }
  return { tb, a, b, pts, N, step: per / N, w: a * 2, h: b * 2, str, color: o.color || COL.paper, ink: o.ink || '#22304A' };
}

function nearestIdx(B, dx, dy) {
  const ang = Math.atan2(dy, dx); let best = 0, bd = 9;
  for (let i = 0; i < B.N; i++) { const th = Math.atan2(B.pts[i][1] / B.b, B.pts[i][0] / B.a); let d = Math.abs(th - ang); if (d > Math.PI) d = TAU - d; if (d < bd) { bd = d; best = i; } }
  return best;
}

/* cx,cy = bubble centre (screen). tip = where the tail ends (computed from the speaker's head each frame). */
function drawBubble(ctx, B, cx, cy, tip, o = {}) {
  const sc = o.scale === undefined ? 1 : o.scale, al = o.alpha === undefined ? 1 : o.alpha;
  if (al <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= al;
  // pop from the tail tip
  if (sc !== 1) { ctx.translate(tip[0], tip[1]); ctx.scale(sc, sc); ctx.translate(-tip[0], -tip[1]); }
  ctx.translate(cx, cy);
  const tx = tip[0] - cx, ty = tip[1] - cy;
  const ic = nearestIdx(B, tx, ty), m = Math.max(3, Math.round(30 / B.step));
  const iA = (ic - m + B.N) % B.N, iB = (ic + m) % B.N, A = B.pts[iA], Bp = B.pts[iB];
  const mx = (A[0] + Bp[0]) / 2, my = (A[1] + Bp[1]) / 2, dx = tx - mx, dy = ty - my, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const curl = Math.min(30, L * 0.22) * (tx >= 0 ? 1 : -1) * 0.8;
  const path = new Path2D();
  path.moveTo(A[0], A[1]);
  path.bezierCurveTo(A[0] + dx * 0.30 + nx * curl * 0.6, A[1] + dy * 0.30 + ny * curl * 0.6, tx - dx * 0.22 + nx * curl, ty - dy * 0.22 + ny * curl, tx, ty);
  path.bezierCurveTo(tx - dx * 0.10 + nx * curl * 0.15, ty - dy * 0.10 + ny * curl * 0.15, Bp[0] - dx * 0.34, Bp[1] - dy * 0.34, Bp[0], Bp[1]);
  for (let j = 1; j < B.N - 2 * m; j++) { const p = B.pts[(iB + j) % B.N]; path.lineTo(p[0], p[1]); }
  path.closePath();
  ctx.save(); ctx.translate(3, 7); ctx.fillStyle = 'rgba(15,25,50,.16)'; ctx.fill(path); ctx.restore();
  ctx.fillStyle = lg(ctx, 0, -B.b, 0, B.b, [[0, '#FFFFFF'], [1, B.color]]); ctx.fill(path);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = B.ink; ctx.lineWidth = 4.2; ctx.stroke(path);
  ctx.save(); ctx.translate(1.4, -1.1); ctx.rotate(0.004); ctx.strokeStyle = rgba(B.ink, 0.22); ctx.lineWidth = 1.8; ctx.stroke(path); ctx.restore();
  B.tb.draw(ctx, -B.tb.w / 2, -B.tb.h / 2, { color: o.color || COL.ink, hi: o.hi, w: B.tb.w });
  ctx.restore();
}

/* thought cloud: scalloped outline, trailing dots toward the thinker; silent thoughts only */
function drawThought(ctx, B, cx, cy, tip, o = {}) {
  const al = o.alpha === undefined ? 1 : o.alpha, sc = o.scale === undefined ? 1 : o.scale; if (al <= 0.01) return;
  ctx.save(); ctx.globalAlpha *= al; ctx.translate(tip[0], tip[1]); ctx.scale(sc, sc); ctx.translate(-tip[0], -tip[1]);
  const a = B.a * 1.02, b = B.b * 1.05, N = 14, cir = [];
  for (let i = 0; i < N; i++) { const th = i / N * TAU; cir.push([cx + Math.cos(th) * (a - 20), cy + Math.sin(th) * (b - 16), 40 + (i % 3) * 5]); }
  const dots = []; for (let i = 0; i < 3; i++) { const t = (i + 1) / 4; dots.push([lerp(cx + (tip[0] - cx) * 0.55, tip[0], t) + 0, lerp(cy + b * 0.85, tip[1], t), 17 - i * 4.5]); }
  ctx.fillStyle = '#7C8AA5'; for (const [x, y, r] of cir) { ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, TAU); ctx.fill(); } for (const [x, y, r] of dots) { ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#F4F7FC'; for (const [x, y, r] of cir) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); } ctx.beginPath(); ctx.ellipse(cx, cy, a - 24, b - 20, 0, 0, TAU); ctx.fill(); for (const [x, y, r] of dots) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
  B.tb.draw(ctx, cx - B.tb.w / 2, cy - B.tb.h / 2, { color: '#44516C', ipaColor: 'rgba(68,81,108,.8)' });
  ctx.restore();
}

/* ------------------------------------------------------------ ribbons & shapes */
function banner(ctx, cx, cy, w, h, color, o = {}) {
  const al = o.alpha === undefined ? 1 : o.alpha, fold = Math.min(46, h * 0.5), x0 = cx - w / 2, x1 = cx + w / 2, y0 = cy - h / 2, y1 = cy + h / 2, arch = o.arch === undefined ? 8 : o.arch;
  ctx.save(); ctx.globalAlpha *= al; ctx.lineJoin = 'round';
  // back folds
  ctx.fillStyle = shade(color, -0.3);
  for (const s of [-1, 1]) { const ex = s < 0 ? x0 : x1; ctx.beginPath(); ctx.moveTo(ex - s * 4, y0 + 14); ctx.lineTo(ex + s * 4 + s * fold * 0.2, y0 + 14); ctx.lineTo(ex + s * fold * 0.6, y1 + 14); ctx.lineTo(ex - s * 6, y1 + 14); ctx.closePath(); ctx.fill(); }
  // swallowtail ends
  for (const s of [-1, 1]) { const ex = s < 0 ? x0 : x1; ctx.fillStyle = shade(color, -0.12); ctx.beginPath(); ctx.moveTo(ex, y0 + 14); ctx.lineTo(ex - s * fold, y0 + 14); ctx.lineTo(ex - s * fold * 0.62, cy + 14); ctx.lineTo(ex - s * fold, y1 + 14); ctx.lineTo(ex, y1 + 14); ctx.closePath(); ctx.fill(); }
  withShadow(ctx, 'rgba(15,25,50,.25)', 14, 0, 7, () => { ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x0, y0 + 14); ctx.quadraticCurveTo(cx, y0 + 14 - arch, x1, y0 + 14); ctx.lineTo(x1, y1 + 14); ctx.quadraticCurveTo(cx, y1 + 14 - arch, x0, y1 + 14); ctx.closePath(); ctx.fill(); });
  ctx.fillStyle = lg(ctx, 0, y0, 0, y1 + 14, [[0, 'rgba(255,255,255,.28)'], [0.5, 'rgba(255,255,255,0)'], [1, 'rgba(0,0,0,.14)']]);
  ctx.beginPath(); ctx.moveTo(x0, y0 + 14); ctx.quadraticCurveTo(cx, y0 + 14 - arch, x1, y0 + 14); ctx.lineTo(x1, y1 + 14); ctx.quadraticCurveTo(cx, y1 + 14 - arch, x0, y1 + 14); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function paper(ctx, x, y, w, h, o = {}) { // soft paper card with slight rotation
  ctx.save(); ctx.globalAlpha *= o.alpha === undefined ? 1 : o.alpha; ctx.translate(x + w / 2, y + h / 2); ctx.rotate(o.rot || 0);
  withShadow(ctx, 'rgba(15,25,50,.22)', 22, 0, 10, () => { ctx.fillStyle = o.color || COL.paper; ctx.beginPath(); rrect(ctx, -w / 2, -h / 2, w, h, o.r || 26); ctx.fill(); });
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || 3; ctx.stroke(); }
  ctx.restore();
}
function tape(ctx, x, y, w, h, color, rot = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot);
  withShadow(ctx, 'rgba(15,25,50,.22)', 10, 0, 5, () => { ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); for (let i = 0; i <= 5; i++) ctx.lineTo(-w / 2 + (i % 2 ? 7 : -1), -h / 2 + i * h / 5); ctx.lineTo(-w / 2, h / 2); ctx.lineTo(w / 2, h / 2); for (let i = 5; i >= 0; i--) ctx.lineTo(w / 2 - (i % 2 ? -1 : 7), -h / 2 + i * h / 5); ctx.closePath(); ctx.fill(); });

/* tile row helper: tiles = [{tb, color, x, w, dy, a, tabL, tabR}] ; text is centred */
function tilesDraw(ctx, tiles, y, h) {
  for (const k of tiles) {
    if (k.a <= 0.01) continue;
    const yy = y + (k.dy || 0);
    ctx.save(); ctx.globalAlpha *= k.a;
    tile(ctx, k.x, yy, k.w, h, k.color, k.tabL, k.tabR);
    k.tb.draw(ctx, k.x + k.w / 2 - k.tb.w / 2, yy + h / 2 - k.tb.h / 2 - 2, { color: '#FFFFFF', ipaColor: 'rgba(255,255,255,.92)' });
    ctx.restore();
  }
}
const tileW = (tb) => tb.w + 76;
function layoutRow(tbs, cx) { const ws = tbs.map(tileW), tot = ws.reduce((a, b) => a + b, 0); let x = cx - tot / 2; return ws.map(w => { const r = { x, w }; x += w; return r; }); }
function useRibbon(S, ctx, t, g, label, hideAt) { // "Use one: ..." ribbon at the top; optionally leaves before the first speech bubble
  let p = pr(t, g.t0 - 0.1, g.t0 + 0.7, E.back); if (hideAt) p *= 1 - pr(t, hideAt, hideAt + 0.35); if (p <= 0.01) return;

/* lesson4.js — data-driven class activities for the one-hour lesson.
   build/activities.js (generated from tools/lesson_hour.py) describes each activity; this file turns it into groups.
   Types: info, table, choral, say, choose, fix, sort, pair, timer, skit.  Every word drawn here is a T() block, so it carries IPA. */
'use strict';
const FURN = new Set(['cafe', 'office', 'travel']);
const TRI = (a, b, c) => ({ [a]: { x: 300, y: 1010, s: 0.86 }, [b]: { x: 960, y: 990, s: 0.78, z: 1 }, [c]: { x: 1620, y: 1010, s: 0.86, flip: true } });
const lineOf = id => Eng.LINE[id];
const curIdx = (items, t) => { let k = -1; for (let i = 0; i < items.length; i++) if (t >= items[i].q0 - 0.35) k = i; return k; };
const lowerSet = arr => new Set((arr || []).map(w => w.toLowerCase()));
const unitSet = (tb, words) => { const w = lowerSet(words), out = new Set(); tb.L.units.forEach((u, i) => { if (w.has(u.word.toLowerCase())) out.add(i); }); return out; };
const sizeFor = (len, big = 112) => len <= 5 ? big : len <= 12 ? Math.round(big * 0.84) : len <= 24 ? Math.round(big * 0.64) : Math.round(big * 0.5);
const DARKGREEN = '#0A6B3D';
function sweepT(tb, t0, t1, t) { if (t < t0 || t > t1 + 0.05) return null; return { [wordAt(wordWeights(tb), clamp((t - t0) / Math.max(0.1, t1 - t0)))]: 'rgba(255,214,102,.7)' }; }

function dots(ctx, n, cur, cx, y) {
  const gap = 30, x0 = cx - (n - 1) * gap / 2;
  for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(x0 + i * gap, y, i === cur ? 10 : 6.5, 0, TAU); ctx.fillStyle = i < cur ? COL.part : i === cur ? COL.gold : 'rgba(20,33,61,.2)'; ctx.fill(); if (i === cur) { ctx.strokeStyle = COL.navy; ctx.lineWidth = 2.5; ctx.stroke(); } }
}
function micIcon(ctx, x, y, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); rrect(ctx, -9, -24, 18, 32, 9); ctx.fill(); ctx.beginPath(); ctx.arc(0, -2, 16, 0.15, Math.PI - 0.15); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, 24); ctx.stroke(); ctx.restore();
}
function speakerIcon(ctx, x, y, s, t, col) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-18, -8); ctx.lineTo(-8, -8); ctx.lineTo(8, -22); ctx.lineTo(8, 22); ctx.lineTo(-8, 8); ctx.lineTo(-18, 8); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 3; i++) { ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 7 - i * 1.1)); ctx.beginPath(); ctx.arc(8, 0, 14 + i * 10, -0.8, 0.8); ctx.stroke(); }
  ctx.restore();
}
/* mic + countdown ring for "class speaks now" holds */
function speakRing(ctx, x, y, r, p, col = COL.part) { ring(ctx, x, y, r, 1 - p, col, 10); micIcon(ctx, x, y, r / 46, col); }

/* a card that always sits in the same place so the eye never has to search */
function cardBox(ctx, w, h, y, o = {}) { paper(ctx, 960 - w / 2, y, w, h, Object.assign({ color: COL.paper, r: 34 }, o)); }

const RENDER = {};

/* ================================================================ SAY IT: prompt -> class answers -> reveal */
RENDER.say = {
  build(a) {
    const S = { rib: Tx(a.title, 46, { weight: 700 }), lab: Tx(a.label || 'Say it', 34), items: [], pausePoints: [] };
    a.items.forEach((it, i) => {
      const q = lineOf(it.q), h = lineOf(it.h), an = lineOf(it.a);
      S.items.push(Object.assign({}, it, { q0: q.t0, h0: h.t0, h1: h.t1, a0: an.t0, a1: an.t1, p: Tx(it.prompt, sizeFor(it.prompt.length), { maxW: 930 }), r: Tx(it.answer, sizeFor(it.answer.length, 104), { maxW: 1100 }) }));
      S.pausePoints.push({ t: h.t0 + 0.2, label: a.title, kind: i === 0 ? 'round' : 'item' });
    });
    return S;
  },
  ui(ctx, S, t, g, a) {
    useRibbon(S, ctx, t, g, S.rib);

    const p = pr(t, it.q0 - 0.35, it.q0 + 0.1), pH = Math.max(230, it.p.h + 110), aH = Math.max(190, it.r.h + 90), y0 = 176, y1 = y0 + pH + 34;

      pill(ctx, 390, y0 - 26, S.lab.w + 60, S.lab.h + 24, COL.part); S.lab.draw(ctx, 420, y0 - 14, { color: '#fff', ipaColor: 'rgba(255,255,255,.9)' });

      const ap = pr(t, it.a0 - 0.05, it.a0 + 0.5, E.back);
      if (ap <= 0.01) { ctx.save(); ctx.strokeStyle = 'rgba(20,33,61,.25)'; ctx.setLineDash([16, 12]); ctx.lineWidth = 4; ctx.beginPath(); rrect(ctx, 360, y1, 1200, aH, 34); ctx.stroke(); ctx.restore(); }
      else { ctx.save(); ctx.globalAlpha *= clamp(ap); ctx.translate(0, (1 - clamp(ap)) * 24); paper(ctx, 360, y1, 1200, aH, { color: '#E4F6EC', r: 34, stroke: COL.ok, sw: 5 });

};

/* ================================================================ CHORAL: listen, then everyone repeats */
RENDER.choral = {
  build(a) {
    const S = { rib: Tx(a.title, 46, { weight: 700 }), listen: Tx('Listen', 36), you: Tx('Everyone', 36), items: [], pausePoints: [] };
    a.items.forEach((it, i) => {
      const m = lineOf(it.m), h = lineOf(it.h);
      S.items.push(Object.assign({}, it, { q0: m.t0, m1: m.t1, h0: h.t0, h1: h.t1, tb: Tx(it.text, sizeFor(it.text.length, 96), { maxW: 1240 }) }));
    });
    S.pausePoints.push({ t: S.items[0].q0 - 0.6, label: a.title, kind: 'round' });
    return S;
  },
  ui(ctx, S, t, g, a) {
    useRibbon(S, ctx, t, g, S.rib);
    const i = curIdx(S.items, t); if (i < 0) return; const it = S.items[i];
    const p = pr(t, it.q0 - 0.35, it.q0 + 0.15), H = Math.max(260, it.tb.h + 130), y0 = 220;
    appear(ctx, p, () => {
      cardBox(ctx, 1320, H, y0);
      hero(ctx, it.tb, 960 - it.tb.w / 2, y0 + (H - it.tb.h) / 2, it.roles || [], { hi: t < it.m1 + 0.1 ? sweep(it.tb, it.m, t) : null });
      const listening = t < it.m1 + 0.15, w = (listening ? S.listen : S.you);
      const pc = listening ? COL.subj : COL.part; pill(ctx, 960 - (w.w + 130) / 2, y0 + H + 22, w.w + 130, w.h + 26, pc);

      if (listening) speakerIcon(ctx, 960 - w.w / 2 - 28, y0 + H + 22 + (w.h + 26) / 2, 0.7, t, '#fff'); else micIcon(ctx, 960 - w.w / 2 - 28, y0 + H + 22 + (w.h + 26) / 2, 0.55, '#fff');

/* ================================================================ TABLE: rows spoken, then repeated */
RENDER.table = {
  build(a) {
    const S = { rib: Tx(a.title, 44, { weight: 700 }), cols: a.cols.map(c => Tx(c, 32)), rows: [], pausePoints: [] };
    const n = a.rows.length, size = n > 6 ? 44 : n > 4 ? 50 : 56;
    S.size = size; S.rowH = Math.min(118, Math.floor(610 / n));

    });

  ui(ctx, S, t, g, a) {

    paper(ctx, x0, 140, W, 790, { color: COL.paper, r: 34 });
    const nc = a.cols.length, centers = hasLabel ? [380, 1180] : nc === 2 ? [610, 1270] : [520, 960, 1400];
    const hcol = hasLabel ? [COL.grey, COL.subj] : nc === 2 ? [COL.grey, COL.part] : [COL.grey, COL.subj, COL.part];
    if (!hasLabel && (a.emph === -1 || a.emph === nc - 1) || (a.emph !== undefined && a.emph >= 0)) { const e = a.emph >= 0 ? a.emph : nc - 1; ctx.fillStyle = COL.partL; ctx.beginPath(); rrect(ctx, centers[e] - 195, 160, 390, 755, 26); ctx.fill(); }
    a.cols.forEach((c, k) => { const b = S.cols[k], w = b.w + 56; pill(ctx, centers[k] - w / 2, 168, w, b.h + 22, hcol[k] || COL.grey); b.draw(ctx, centers[k] - b.w / 2, 178, { color: '#fff', ipaColor: 'rgba(255,255,255,.9)' }); });
    S.rows.forEach((r, i) => {
      const ra = pr(t, r.q0 - 0.15, r.q0 + 0.3, E.out); if (ra <= 0.01) return; const y = top + i * S.rowH;
      const active = t >= r.q0 - 0.05 && t < r.h1;
      appear(ctx, ra, () => {
        if (active) { ctx.fillStyle = 'rgba(255,214,102,.38)'; ctx.beginPath(); rrect(ctx, x0 + 20, y - 8, W - 40, S.rowH - 6, 22); ctx.fill(); }
        if (r.label) {

    Eng.pausePoints.filter(pp => pp.kind !== 'item').forEach(pp => { const m = document.createElement('b'); m.className = 'star'; m.style.left = (pp.t / dur * 100) + '%'; m.title = pp.label || 'Practice'; m.textContent = '★'; marks.appendChild(m); });
    const chs = $('chapters');
    TL.chapters.forEach((c, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chap'; b.innerHTML = ''; b.append(c.label + ' '); const sm = document.createElement('small'); sm.textContent = fmt(Eng.chapterStart[i]); b.append(sm); b.title = c.label + ' \u2013 starts at ' + fmt(Eng.chapterStart[i]); b.dataset.i = i; b.addEventListener('click', () => { seek(Eng.chapterStart[i]); if (!P.playing) play(); }); chs.appendChild(b); });
    sc.addEventListener('input', () => { const was = P.playing; if (was) pause(); seek(+sc.value); if (was) play(); });
    $('btnPlay').addEventListener('click', () => (P.playing ? pause() : play()));
    $('btnReplay').addEventListener('click', replay);
    const vn = $('vn'), vm = $('vm'); vn.value = narr.vol; vm.value = music.vol;
    vn.addEventListener('input', () => { narr.setVol(+vn.value); store.set('vn', +vn.value); });
    vm.addEventListener('input', () => { music.setVol(+vm.value); store.set('vm', +vm.value); });
    const mute = $('mute'); mute.addEventListener('click', () => { const m = !narr.muted; narr.setMuted(m); music.setMuted(m); mute.setAttribute('aria-pressed', m); mute.textContent = m ? 'Unmute' : 'Mute'; });
    const cc = $('cc'); Eng.captions = store.get('cc', true); cc.setAttribute('aria-pressed', Eng.captions); cc.addEventListener('click', () => { Eng.captions = !Eng.captions; cc.setAttribute('aria-pressed', Eng.captions); store.set('cc', Eng.captions); drawOnce(); });
    const ap = $('autopause'); P.apMode = store.get('apm', 'round'); if (!['off', 'round', 'item'].includes(P.apMode)) P.apMode = 'round'; ap.value = P.apMode; ap.addEventListener('change', () => { P.apMode = ap.value; store.set('apm', ap.value); });
    const setBar = hide => { $('bar').hidden = hide; $('mini').hidden = !hide; store.set('hide', hide); P.fitCtl && P.fitCtl(); sizeCanvas(); drawOnce(); };
    $('hideBar').addEventListener('click', () => setBar(true)); $('showBar').addEventListener('click', () => setBar(false)); $('miniPlay').addEventListener('click', () => (P.playing ? pause() : play()));
    P.setBar = setBar; if (store.get('hide', false)) setTimeout(() => setBar(true), 0);
    $('prevAct').addEventListener('click', () => jumpActivity(-1)); $('nextAct').addEventListener('click', () => jumpActivity(1));
    const sp = $('speed'); P.rate = store.get('rate', 1); sp.value = String(P.rate); sp.addEventListener('change', () => { P.rate = +sp.value; store.set('rate', P.rate); narr.setRate(P.rate); music.setRate(P.rate); P.base = { perf: performance.now(), t: P.t }; });
    const fp = $('fps'); P.fps = store.get('fps', 30); fp.value = String(P.fps); fp.addEventListener('change', () => { P.fps = +fp.value; store.set('fps', P.fps); });
    $('full').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => toast('Full screen is not available here. Use the browser full-screen shortcut (F11).')); } });
    // transcript for screen readers / teachers (plain text, no IPA)
    const tr = $('transcriptBody'); let html = '';
    for (const b of TL.beats) for (const l of b.lines) if (l.text && l.kind !== 'hold') html += `<p><strong>${({ N: 'Teacher', D: 'Daniel', M: 'Maya', S: 'Sofia' })[l.who] || ''}${l.kind === 'thought' ? ' (thinking)' : ''}:</strong> ${l.text.replace(/</g, '&lt;')}</p>`;
    tr.innerHTML = html;
    // canvas interaction (checks)
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * VW, (e.clientY - r.top) / r.height * VH]; };
    cv.addEventListener('click', e => { const [x, y] = pt(e); if (Eng.click(x, y)) { drawOnce(); } });
    cv.addEventListener('pointermove', e => { const [x, y] = pt(e); cv.style.cursor = Eng.cursorAt(x, y) ? 'pointer' : 'default'; });
    Eng.onPick = (id, i) => { live(`Answer chosen: option ${i + 1}.`); if (!P.playing) setTimeout(drawOnce, 0); };
    document.addEventListener('keydown', onKey);
  }
  function onKey(e) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' && e.target.type === 'range' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    if (tag === 'select') return;
    const k = e.key;
    if (k === ' ' && tag !== 'button') { e.preventDefault(); P.playing ? pause() : play(); }
    else if (k === 'ArrowRight') { seek(P.t + 5); }
    else if (k === 'ArrowLeft') { seek(P.t - 5); }
    else if (k === ']') { jumpChapter(1); } else if (k === '[') { jumpChapter(-1); }
    else if (k === 'n' || k === 'N') jumpActivity(1); else if (k === 'p' || k === 'P') jumpActivity(-1);
    else if (k === 'c' || k === 'C') $('cc').click();
    else if (k === 'm' || k === 'M') $('mute').click();
    else if (k === 'f' || k === 'F') $('full').click();
    else if (k === 'h' || k === 'H') P.setBar(!$('bar').hidden);
    else if (k === 'r' || k === 'R') replay();
    else if (/^[1-4]$/.test(k)) { const h = Eng.hot[+k - 1]; if (h) { h.fn(); drawOnce(); } }
  }
  function jumpActivity(d) {
    const G = Eng.groups; let tt = null;
    if (d > 0) { const g = G.find(g => g.t0 > P.t + 0.6); tt = g ? g.t0 : null; }
    else { for (const g of G) if (g.t0 < P.t - 2) tt = g.t0; if (tt === null) tt = 0; }
    if (tt !== null) { const was = P.playing; if (was) pause(); seek(tt); if (was) play(); }
  }
  function curChapter() { let c = 0; Eng.chapterStart.forEach((s, i) => { if (P.t >= s - 0.01) c = i; }); return c; }
  function jumpChapter(d) { const c = curChapter(); let n = clamp(c + d, 0, Eng.chapterStart.length - 1); if (d < 0 && P.t - Eng.chapterStart[c] > 2) n = c; seek(Eng.chapterStart[n]); }
  function updateUI() {
    const sc = $('scrub'); sc.value = P.t; sc.style.setProperty('--p', (P.t / P.dur * 100) + '%'); $('time').textContent = fmt(P.t);
    sc.setAttribute('aria-valuetext', fmt(P.t) + ' of ' + fmt(P.dur));
    const c = curChapter(); document.querySelectorAll('.chap').forEach((b, i) => b.setAttribute('aria-current', i === c ? 'true' : 'false'));
  }
  function announceChapter() { const c = curChapter(); if (c !== P.lastCh) { P.lastCh = c; live('Chapter: ' + Eng.TL.chapters[c].label); } }
  let toastTimer = 0;
  function toast(msg, ms = 3500) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); live(msg); }
  function hideToast() { $('toast').hidden = true; }
  function live(msg) { $('live').textContent = ''; setTimeout(() => { $('live').textContent = msg; }, 30); }

  window.addEventListener('DOMContentLoaded', init);
})();
</script>
