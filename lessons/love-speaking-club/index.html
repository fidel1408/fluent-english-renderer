<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Speaking Club - Fluent English</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chapters.css">
</head>
<body>
<div id="app" data-controls="shown" data-reduced="auto">
  <div id="stageWrap">
    <div id="board" role="main" aria-label="Lesson stage">
      <div id="art" aria-hidden="false"></div>
      <div id="scrim"></div>
      <div id="ui"></div>
      <div id="hud">
        <img class="logo" alt="Fluent English" src="assets/fluent_english_logo_white.png">
        <div class="corner"><span class="demoChip"></span><span class="modePill"></span><span class="chapterPill"></span><span id="timerChip"></span></div>
      </div>
      <div id="layerNarr"><div id="narr" role="status" aria-live="polite"></div></div>
      <div id="drawers"></div>
      <div id="startOverlay"></div>
    </div>
    <button id="showControls" type="button" aria-label="Show controls" title="Show controls (H)"></button>
  </div>
  <div id="bar" role="toolbar" aria-label="Lesson controls"></div>
</div>
<script src="js/art-core.js"></script>
<script src="js/art-figure.js"></script>
<script src="js/art-scenes.js"></script>
<script src="js/art-cast.js"></script>
<script src="js/content.js"></script>
<script src="js/ipa-data.js"></script>
<script src="js/ipa.js"></script>
<script src="audio/manifest.js"></script>
<script src="js/engine.js"></script>
<script src="js/vignettes.js"></script>
<script src="js/vignettes-words.js"></script>
<script src="js/vignettes-mystery.js"></script>
<script src="js/vignettes-misc.js"></script>
<script src="js/chapters-common.js"></script>
<script src="js/chapters-a.js"></script>
<script src="js/chapters-b.js"></script>
<script src="js/chapters-c.js"></script>
<script src="js/chapters-d.js"></script>
<script>FE_BOOT();</script>
</body>
</html>
